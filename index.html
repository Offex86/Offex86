<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Video Downloader</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4361ee;
            --dark: #212529;
            --light: #f8f9fa;
            --danger: #ef233c;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--light);
            color: var(--dark);
            transition: all 0.3s ease;
        }
        body.dark {
            background-color: #121212;
            color: var(--light);
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        h1 {
            font-size: 2rem;
            background: linear-gradient(45deg, #4361ee, #3a0ca3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .theme-toggle {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--dark);
        }
        .dark .theme-toggle {
            color: var(--light);
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
        }
        #videoUrl {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s;
        }
        #videoUrl:focus {
            border-color: var(--primary);
            outline: none;
        }
        #downloadBtn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0 25px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        #downloadBtn:hover {
            background-color: #3a0ca3;
        }
        .platform-tags {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .tag {
            background-color: #e9ecef;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .dark .tag {
            background-color: #333;
        }
        .result {
            display: none;
            margin-top: 2rem;
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .video-info {
            display: flex;
            gap: 20px;
            margin-bottom: 1.5rem;
        }
        .thumbnail {
            width: 200px;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
        }
        .video-details {
            flex: 1;
        }
        .video-title {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }
        .download-options {
            display: flex;
            gap: 10px;
            margin-top: 1rem;
        }
        .download-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }
        .download-btn:hover {
            background-color: #3a0ca3;
            transform: translateY(-2px);
        }
        .loader {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top: 4px solid var(--primary);
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            color: var(--danger);
            margin-top: 1rem;
            display: none;
        }
        @media (max-width: 600px) {
            .video-info {
                flex-direction: column;
            }
            .thumbnail {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Universal Video Downloader</h1>
            <button class="theme-toggle" id="themeToggle">
                <i class="fas fa-moon"></i>
            </button>
        </header>

        <div class="platform-tags">
            <div class="tag"><i class="fab fa-youtube"></i> YouTube</div>
            <div class="tag"><i class="fab fa-instagram"></i> Instagram</div>
            <div class="tag"><i class="fab fa-facebook"></i> Facebook</div>
            <div class="tag"><i class="fab fa-twitter"></i> Twitter</div>
            <div class="tag"><i class="fab fa-tiktok"></i> TikTok</div>
        </div>

        <div class="input-group">
            <input type="text" id="videoUrl" placeholder="Paste video link here...">
            <button id="downloadBtn">Download</button>
        </div>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p>Fetching video info...</p>
        </div>

        <div class="error" id="error"></div>

        <div class="result" id="result">
            <div class="video-info">
                <img class="thumbnail" id="thumbnail" src="" alt="Video Thumbnail">
                <div class="video-details">
                    <h3 class="video-title" id="title"></h3>
                    <div class="download-options">
                        <a href="#" class="download-btn" id="downloadLink">
                            <i class="fas fa-download"></i> Download Video
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Theme Toggle
        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark');
            const icon = themeToggle.querySelector('i');
            if (document.body.classList.contains('dark')) {
                icon.classList.replace('fa-moon', 'fa-sun');
            } else {
                icon.classList.replace('fa-sun', 'fa-moon');
            }
        });

        // Download Function
        const downloadBtn = document.getElementById('downloadBtn');
        const videoUrl = document.getElementById('videoUrl');
        const loader = document.getElementById('loader');
        const result = document.getElementById('result');
        const error = document.getElementById('error');
        const title = document.getElementById('title');
        const thumbnail = document.getElementById('thumbnail');
        const downloadLink = document.getElementById('downloadLink');

        downloadBtn.addEventListener('click', async () => {
            const url = videoUrl.value.trim();
            if (!url) {
                showError('Please enter a video URL');
                return;
            }

            // Show loader
            loader.style.display = 'block';
            result.style.display = 'none';
            error.style.display = 'none';

            try {
                const response = await fetch(`/download?url=${encodeURIComponent(url)}`);
                const data = await response.json();

                if (data.error) {
                    showError(data.error);
                    return;
                }

                // Display result
                title.textContent = data.title || 'Video';
                thumbnail.src = data.thumbnail || '';
                downloadLink.href = data.url;
                result.style.display = 'block';
            } catch (err) {
                showError('Failed to fetch video. Please try again.');
            } finally {
                loader.style.display = 'none';
            }
        });

        function showError(message) {
            error.textContent = message;
            error.style.display = 'block';
        }

        // Auto-focus input on page load
        window.onload = () => videoUrl.focus();
    </script>
</body>
</html>
